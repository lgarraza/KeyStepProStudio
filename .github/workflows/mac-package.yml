name: mac-package

# Builds the macOS app (universal arm64 + x86_64) for both editions, ad-hoc signs it and zips it.
# Run it by hand (Actions > mac-package > Run workflow) to get the zips as artifacts, or push a v* tag to
# attach them to that release. Not notarized: on first launch use right-click > Open.

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        edition: [lite, full]
    steps:
      - uses: actions/checkout@v4
      - name: Version
        id: v
        run: echo "version=$(sed -n 's/^project(KeyStepProStudio VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)" >> "$GITHUB_OUTPUT"
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64" "-DKSP_ENABLE_VST_HOST=${{ matrix.edition == 'full' && 'ON' || 'OFF' }}"
      - name: Build
        run: cmake --build build --config Release --target KeyStepProStudio --parallel
      - name: Package
        run: |
          set -e
          sfx="${{ matrix.edition == 'full' && '-Full' || '' }}"
          out="KeyStepProStudio${sfx}-${{ steps.v.outputs.version }}-mac"
          mkdir -p "pkg/$out"
          cp -R "build/KeyStepProStudio_artefacts/Release/KeyStepPro Studio.app" "pkg/$out/"
          codesign --force --deep -s - "pkg/$out/KeyStepPro Studio.app"
          cp README.md LICENSE THIRD_PARTY_NOTICES.md "pkg/$out/"
          (cd pkg && ditto -c -k --keepParent "$out" "../$out.zip")
          shasum -a 256 "$out.zip" | tee "$out.zip.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: mac-${{ matrix.edition }}
          path: |
            KeyStepProStudio*-mac.zip
            KeyStepProStudio*-mac.zip.sha256
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.ref_name }}" KeyStepProStudio*-mac.zip KeyStepProStudio*-mac.zip.sha256 --clobber
